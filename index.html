<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>daen141kk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #000;
    font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-variant-ligatures: none;
    font-feature-settings: "calt" 0, "liga" 0;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .center {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 2;
  }
  h1 {
    position: relative;
    font-size: clamp(28px, 7vw, 72px);
    letter-spacing: .015em;
    font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
    font-weight: 700;
    color: #eaeaea;
    text-shadow: 0 0 22px rgba(220,226,235,.10);
    white-space: nowrap;
    line-height: 1.2;
    background: none;
    padding: 0;
  }
  h1 .name { display: block; }
  h1 .cur {
    position: absolute;
    left: 100%;
    bottom: .12em;
    display: block;
    width: .48em;
    height: .075em;
    margin-left: .13em;
    background: #d9dee6;
    animation: blink 1.1s steps(1) infinite;
  }
  .links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 5vw, 48px);
    margin-top: 26px;
    padding: 8px 0;
    background: none;
    pointer-events: auto;
  }
  .links a {
    color: #c4cbd5;
    text-decoration: none;
    font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
    font-size: clamp(14px, 2.2vw, 20px);
    font-weight: 500;
    letter-spacing: .025em;
    text-transform: none;
    text-shadow: 0 0 12px rgba(220,226,235,.14);
    transition: color .2s ease, text-shadow .2s ease, transform .2s ease;
    outline-offset: 5px;
  }
  .links a:hover, .links a:focus-visible {
    color: #ffffff;
    text-shadow: 0 0 10px rgba(235,240,248,.45), 0 0 24px rgba(235,240,248,.2);
    transform: translateY(-2px);
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="center">
  <h1><span class="name">daen141kk</span><span class="cur"></span></h1>
  <nav class="links" aria-label="Ссылки">
    <a href="https://steamcommunity.com/id/daen141kk/" target="_blank" rel="noopener noreferrer">Steam</a>
    <a href="https://t.me/daen141kk" target="_blank" rel="noopener noreferrer">Telegram</a>
  </nav>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン一二三四五六七八九十零月火水木金土日東京電脳未来影龍空光闇愛夢';
  let fontSize = 30;
  const getFontSize = () => Math.max(25, Math.min(38, Math.round(window.innerWidth / 42))); 
  let W = 0, H = 0, dpr = 1, columns = 0, drops = [], speeds = [];
  let lastFrame = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    fontSize = getFontSize();
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Math.ceil(W / fontSize);
    drops = Array.from({ length: columns }, () => Math.random() * (H / fontSize));
    speeds = Array.from({ length: columns }, (_, i) => 0.22 + (i % 7) * 0.035 + Math.random() * 0.12);
  }

  function frame(now = 0) {
    const dt = Math.min(2, (now - (lastFrame || now)) / 16.67);
    lastFrame = now;
    // Мягкий шлейф вместо резкого мерцания и перегруженного фона.
    ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = fontSize + 'px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';

    for (let i = 0; i < drops.length; i++) {
      const x = i * fontSize + fontSize / 2;
      const y = drops[i] * fontSize;
      const char = glyphs[(i * 13 + Math.floor(drops[i] * 3)) % glyphs.length];
      // Сдержанная графитовая палитра; яркая головка появляется редко.
      ctx.fillStyle = Math.random() > 0.997 ? '#d9dee6' : (i % 3 === 0 ? 'rgba(174,181,192,.48)' : 'rgba(113,121,133,.30)');
      ctx.shadowBlur = 0;
      ctx.fillText(char, x, y);
      drops[i] += speeds[i] * dt;
      if (y > H + fontSize && Math.random() > 0.985) {
        drops[i] = -Math.random() * (H / fontSize * 0.35);
      }
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
